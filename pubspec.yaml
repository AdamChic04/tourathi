name: tourathi
description: TouRathi - AI-powered smart tourism app for Jordan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  flutter_staggered_animations: ^1.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
